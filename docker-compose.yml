version: "3.8"

services:
  collector:
    build: .
    container_name: unified-collector
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - API_KEY=${API_KEY}
      - DB_PATH=/app/data/collector.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
