version: "3.8"

services:
  collector:
    build: .
    container_name: unified-collector
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    # 硬编码 DNS：避免依赖 host 的 /etc/resolv.conf（若 host 上 Tailscale MagicDNS 100.100.100.100
    # 健康检查失败，所有容器内域名解析会断）。任何容器重启都能拿到稳定 DNS。
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 9.9.9.9
    environment:
      - API_KEY=${API_KEY}
      - DB_URL=postgresql://collector:${PG_PASSWORD}@postgres:5432/collector
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: collector-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
